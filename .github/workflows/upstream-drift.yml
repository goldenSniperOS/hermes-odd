name: Upstream drift

# Weekly check of gentle-ai and gentle-shell against upstream/upstream.lock.json.
# Exit code 0 (clean) passes, 2 (error) fails the job, 1 (drift) opens or
# updates ONE open issue with the report. Labels: the job creates the
# `upstream-port` and `needs-triage` labels of the port request template
# idempotently (`gh label create --force`) before using them.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check upstream drift
        id: drift
        env:
          HERMES_ODD_UPSTREAM_CACHE: ${{ runner.temp }}/upstream
        run: |
          set +e
          python scripts/check_upstream_drift.py --format markdown --output drift.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ -f drift.md ] && cat drift.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ge 2 ]; then
            echo "::error::Upstream drift check failed (exit $code); see the log above"
            exit 1
          fi

      - name: Open or update the drift issue
        if: steps.drift.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "[upstream-drift] Upstream changes to triage"
        run: |
          set -euo pipefail
          gh label create upstream-port --color 5319e7 --description "Port a gentle-ai or gentle-shell change" --force
          gh label create needs-triage --color fbca04 --description "Needs a triage decision" --force
          number=$(gh issue list --state open --limit 100 --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file drift.md --add-label upstream-port,needs-triage
            echo "Updated issue #$number"
          else
            gh issue create --title "$TITLE" --body-file drift.md --label upstream-port,needs-triage
          fi
